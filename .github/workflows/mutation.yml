name: Full mutation

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-mutation:
    name: Full mutation
    runs-on: ubuntu-latest
    env:
      DB_PATH: ${{ github.workspace }}/job-radar-full-mutation.sqlite
      SERPER_API_KEY: full-mutation-ci-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Copy environment template
        run: cp .env.example .env
      - name: Run full mutation
        run: pnpm test:mutation
      - name: Upload full mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: job-radar-mutation-full
          path: reports/mutation
          if-no-files-found: warn
