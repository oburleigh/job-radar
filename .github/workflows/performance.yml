name: Scheduled performance evidence

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-performance
  cancel-in-progress: true

jobs:
  latency:
    name: HTTP and SQLite latency
    runs-on: ubuntu-latest
    env:
      DB_PATH: ${{ github.workspace }}/job-radar-performance.sqlite
      SERPER_API_KEY: performance-ci-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm build
      - run: pnpm performance:latency
      - name: Upload latency report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: job-radar-latency
          path: artifacts/latency
          if-no-files-found: warn
