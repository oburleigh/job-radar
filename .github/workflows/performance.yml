name: Scheduled performance evidence

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-performance
  cancel-in-progress: true

jobs:
  latency:
    name: HTTP and SQLite latency
    runs-on: ubuntu-latest
    env:
      DB_PATH: ${{ github.workspace }}/job-radar-performance.sqlite
      SERPER_API_KEY: performance-ci-key
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm build
      - run: pnpm performance:latency
      - name: Upload latency report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: job-radar-latency
          path: artifacts/latency
          if-no-files-found: warn
