name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-start:
    name: Clean start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only on push and pull request. macOS bills at 10x and Windows at 2x, which
        # exhausted the runner allowance and blocked the gates that guard every change.
        # Run the full matrix on demand with: gh workflow run ci.yml
        os: >-
          ${{ github.event_name == 'workflow_dispatch'
          && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]')
          || fromJSON('["ubuntu-latest"]') }}
    env:
      DB_PATH: ${{ github.workspace }}/job-radar-clean-start.sqlite
      SERPER_API_KEY: clean-start-ci-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Copy environment template on Linux and macOS
        if: runner.os != 'Windows'
        run: cp .env.example .env
      - name: Copy environment template on Windows PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item .env.example .env
      - run: pnpm setup:check
      - run: pnpm db:setup
      - run: pnpm db:setup
      - name: Verify clean-start database behavior
        run: >-
          pnpm exec vitest run
          scripts/check-prerequisites.test.ts
          scripts/migrate.test.ts
          tests/architecture/schema-only-migrations.test.ts
          src/contexts/discovery/infrastructure/configuration/bootstrap-job-radar.test.ts
      - name: Install Playwright browsers on Linux
        id: playwright-install-linux
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Install Playwright browsers on macOS and Windows
        id: playwright-install-non-linux
        continue-on-error: true
        run: pnpm exec playwright install chromium
        if: runner.os != 'Linux'
      - name: Run clean-start browser journey
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: ${{ (steps.playwright-install-linux.outcome == 'failure' || steps.playwright-install-non-linux.outcome == 'failure') && '1' || '' }}
        run: pnpm test:browser e2e/onboarding.spec.ts

  verify:
    name: Repository gates
    runs-on: ubuntu-latest
    env:
      DB_PATH: ${{ github.workspace }}/job-radar-verify.sqlite
      SERPER_API_KEY: verify-ci-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm evaluate:discovery
      - run: pnpm storybook:build
      - run: pnpm build
      - run: pnpm performance:size
      - name: Run Lighthouse performance budget
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm performance:lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: job-radar-lighthouse
          path: artifacts/lighthouse
          if-no-files-found: warn
      - name: Install Playwright browsers
        id: playwright-install-verify
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser interaction performance budget
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: ${{ steps.playwright-install-verify.outcome == 'failure' && '1' || '' }}
        run: pnpm performance:browser
      - name: Upload browser performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: job-radar-browser-performance
          path: artifacts/browser-performance
          if-no-files-found: warn
      - name: Run deterministic browser integration
        env:
          PLAYWRIGHT_USE_SYSTEM_CHROME: ${{ steps.playwright-install-verify.outcome == 'failure' && '1' || '' }}
        run: pnpm test:browser

  focused-mutation:
    name: Focused mutation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DB_PATH: ${{ github.workspace }}/job-radar-focused-mutation.sqlite
      SERPER_API_KEY: focused-mutation-ci-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Copy environment template
        run: cp .env.example .env
      - name: Run focused mutation
        run: pnpm test:mutation:focused
      - name: Upload focused mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: job-radar-mutation-focused
          path: reports/mutation
          if-no-files-found: warn
